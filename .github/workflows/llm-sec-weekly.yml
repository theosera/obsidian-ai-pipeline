name: LLM-Sec-Weekly Auto Ingest

# 週次 LLM 脅威レポートを Gmail から自動取込し、Vault リポへ commit する
# Level 1 自動化。Security-only mode で人間が手で行うフローを丸ごと cron 化。
#
# 取込される MD / DB / JSON は本リポ (obsidian-ai-pipeline) ではなく
# 別 private repo (= "vault repo") に push される。
# vault repo の URL は VAULT_REPO secret で渡す (`owner/name` 形式)。
#
# 設計上の前提:
#   - vault repo は threat_reports.db を gitignore しない (ai_relevance_note を
#     run 間で保持するため)。詳細は docs/security/llm-sec-weekly-automation.md
#   - メール本文は untrusted_input。本 workflow は parse 時に
#     `forbidden_usage: execute_report_instructions` 契約を強制する
#     (parser が ContractError を throw)。

on:
  schedule:
    # 送信予定 (毎週月曜 8:00 JST) に対し、同じ月曜の内に最大 3 回まで取込を試みる。
    # ChatGPT/Codex 側の遅延で 1 回目にメールが未達でも、後続 run が拾えるようにする
    # 二段の再試行。ingest は UPSERT 冪等 + processed ラベルで self-healing のため、
    # 既に取込済みなら後続 run は no-op (「vault に変更なし」で正常終了) になる。
    # 3 回目 (予定 +6h) でも未達なら**その週は諦め、翌週の月曜 00:00 UTC に持ち越す**。
    - cron: '0 0 * * 1'   # 1 回目: 月曜 00:00 UTC = 09:00 JST (送信予定 8:00 JST + 1h バッファ)
    - cron: '0 2 * * 1'   # 2 回目: 予定 +2h  (月曜 02:00 UTC = 11:00 JST) — 遅延メール救済
    - cron: '0 6 * * 1'   # 3 回目: 予定 +6h  (月曜 06:00 UTC = 15:00 JST) — 最終試行 (以降は翌週へ)
  workflow_dispatch:
    inputs:
      dry_run:
        description: '取込試行のみ (Gmail label 付与 / vault push を skip)'
        type: boolean
        default: false

# GITHUB_TOKEN は read-only。vault repo への push は別資格情報 (deploy key)。
# Megalodon 級供給網攻撃でこのジョブが乗っ取られても、本リポは書き換えられない。
permissions:
  contents: read

# 同時実行禁止 (Gmail API rate / vault repo race を避ける)。
# 前回 run が走行中の間は新規 trigger を待たせる。
concurrency:
  group: llm-sec-weekly-ingest
  cancel-in-progress: false

jobs:
  ingest:
    name: Fetch & ingest weekly threat report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pipeline repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          path: pipeline

      - name: Checkout vault repo (private)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: ${{ secrets.VAULT_REPO }}
          ssh-key: ${{ secrets.VAULT_DEPLOY_KEY }}
          path: vault
          # default branch を chekout (vault 側で main 以外を使うなら secret 化)
          fetch-depth: 1

      - name: Setup pnpm
        # Third-party action — SHA pin (CI workflow と同 SHA で揃える)。
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6.0.9
        with:
          # path: pipeline で checkout しているので workspace root に package.json が
          # 無く、デフォルトの `./package.json` 自動検出が失敗する。pipeline 側を明示。
          package_json_file: pipeline/package.json

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pipeline/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: pipeline
        run: pnpm install --frozen-lockfile

      - name: Rebuild native dependencies (better-sqlite3)
        working-directory: pipeline
        run: pnpm rebuild better-sqlite3

      # ----------------------------------------------------------------
      # DB 配置移行 (iCloud 除外): 旧 __skills/pipeline/threat_reports.db を
      # __skills/pipeline.nosync/ へ一度だけ git mv する (idempotent / 自己修復)。
      #
      # 以降 fetcher は PIPELINE_DB_DIR=.../pipeline.nosync を見るため、移行前に旧パスの
      # DB を新パスへ運んでおかないと、fetcher が空 DB を新パスに新規作成し既存レポート
      # + 人手フィールドを失う。本 step がそれを防ぐ → vault 側の git mv が未実施でも
      # CI 側で吸収できるので、リポ間の順序に依存しない。
      # 注: `pipeline.nosync` は CI(Linux) では単なるフォルダ名で git は通常どおり追跡する。
      # macOS の iCloud Drive だけがこの suffix を同期から除外する (= ローカルでの狙い)。
      # git mv は index を更新するだけ (commit は後段 "Commit & push" step が行う)。
      # ----------------------------------------------------------------
      - name: Migrate threat DB to .nosync dir (idempotent)
        working-directory: vault
        run: |
          set -euo pipefail
          OLD="__skills/pipeline/threat_reports.db"
          NEW="__skills/pipeline.nosync/threat_reports.db"
          # 両方存在 = どちらが正本か自動判断できない異常状態 (過去の手動/失敗移行など)。
          # 黙って NEW を採用すると、空 / stale な .nosync を commit して人手フィールドを
          # 失う恐れがある (= この自己修復が防ぎたい split 状態そのもの)。よって warn して
          # 続行せず loud-fail し、人間に正本確定 + 旧パス削除を委ねる (Codex #114 P2)。
          if [ -f "${OLD}" ] && [ -f "${NEW}" ]; then
            echo "::error::${OLD} と ${NEW} が両方存在します。どちらが正本か自動判断できません。"
            echo "::error::正本を確定し他方を削除してから再実行してください (例: 正本=旧なら 'git rm \"${NEW}\"' 後に旧→新へ git mv し直す / 正本=新なら 'git rm \"${OLD}\"')。"
            exit 1
          fi
          if [ -f "${NEW}" ]; then
            echo "✅ 既に ${NEW} あり — 移行不要"
            exit 0
          fi
          if [ -f "${OLD}" ]; then
            mkdir -p "$(dirname "${NEW}")"
            git mv "${OLD}" "${NEW}"
            echo "📦 移行: ${OLD} -> ${NEW} (commit step で確定)"
          else
            echo "ℹ️ ${OLD} 無し — 新規環境。fetcher が ${NEW} を新規作成する。"
          fi

      # ----------------------------------------------------------------
      # Phase 1: ingest only (label は付けない)
      #
      # 成功した thread の id は pending-labels.json に書き出され、
      # 後段の "Apply Gmail labels" step で label される。
      # 順序: ingest → vault push → label。途中の step が失敗すると
      # label step は実行されず、対象 thread はラベル無しで残るため
      # 次の cron で再試行 (= self-healing)。
      # ----------------------------------------------------------------
      - name: Run fetcher (phase 1 — ingest only)
        working-directory: pipeline
        env:
          VAULT_ROOT: ${{ github.workspace }}/vault
          # DB だけ iCloud 同期外の .nosync ディレクトリへ (raw md / JSON / index は vault 直下のまま)。
          # 未設定なら従来の <vault>/__skills/pipeline。前段の移行 step が旧 DB をここへ運ぶ。
          PIPELINE_DB_DIR: ${{ github.workspace }}/vault/__skills/pipeline.nosync
          # vault repo (= theosera/obsidian-permanent-note) は "Permanent Note"
          # フォルダの中身そのものが repo ルートにある構造なので、デフォルトの
          # 'Permanent Note/10_Threat_Reports' ではなく '10_Threat_Reports' を
          # 直接ベースに指定する。別構造の vault に切り替える場合はこの値だけ
          # 変えれば良い (絶対パス / `..` traversal は parser 側で拒否)。
          THREAT_REPORTS_FOLDER: 10_Threat_Reports
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          # 既定で十分だが上書き可能 (任意 secrets)
          LLM_SEC_LABEL_NAME: ${{ secrets.LLM_SEC_LABEL_NAME }}
          LLM_SEC_PROCESSED_LABEL_NAME: ${{ secrets.LLM_SEC_PROCESSED_LABEL_NAME }}
          LLM_SEC_MAX_RESULTS: ${{ secrets.LLM_SEC_MAX_RESULTS }}
          # ingest と label で同じファイルを参照する必要があるので絶対パスで固定
          # (vault checkout の中ではないので git commit には巻き込まれない)。
          PENDING_LABELS_FILE: ${{ github.workspace }}/pending-labels.json
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            pnpm tsx scripts/llm_sec_weekly_fetcher.ts --phase=ingest --dry-run
          else
            pnpm tsx scripts/llm_sec_weekly_fetcher.ts --phase=ingest
          fi

      # ----------------------------------------------------------------
      # Gate invariant re-check (belt-and-braces)
      #
      # ゲート本体は fetcher が thread ごとに実行済み (L0+L1 →
      # gate_decision.py --profile=ci。non-clean は _quarantine/ へ退避 +
      # 隔離キュー登録し、raw/ には clean 判定のものだけが残る)。本 step は
      # **fetcher 側ゲートの配線回帰を検知する不変条件チェック**: raw/ に
      # 残った新規レポートを同じ決定論コードで再判定し、non-clean が 1 件でも
      # 出たら (= 本来ここに存在しないはず) commit/push 前に run を停止する。
      # trace/queue は fetcher 実行分が正であり、ここでは書かない (--state のみ
      # 共有して heightened を同一条件にする)。スキャナ/決定器は stdlib のみの
      # 本リポ trusted コード。
      # ----------------------------------------------------------------
      - name: Gate invariant re-check (L0+L1+L3 ci profile)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: pipeline
        env:
          VAULT_ROOT: ${{ github.workspace }}/vault
          TR_DIR: 10_Threat_Reports
          SCANNER: .claude/skills/scan-threat-report/scripts/scan-threat-report.py
          GATE: .claude/skills/scan-threat-report/scripts/gate_decision.py
        run: |
          set -euo pipefail
          # この run で新規/変更された raw レポートのみ対象 (vault repo の untracked/modified)。
          mapfile -t files < <(git -C "${VAULT_ROOT}" status --porcelain -- "${TR_DIR}/raw/" | awk '{print $2}')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "新規 raw レポートなし — 再チェック skip"
            exit 0
          fi
          tripped=0
          for rel in "${files[@]}"; do
            full="${VAULT_ROOT}/${rel}"
            [ -f "${full}" ] || continue
            # scanner の exit 1 は「signal あり」の正常系 (fetcher の
            # makeCliGateRunner と同じ扱い)。pipefail 下でパイプに直結すると
            # gate が clean (exit 0) でもパイプ全体が 1 になり、良性 signal を
            # 含む clean レポートが誤って push/label を塞ぐ (PR #116 Codex P1)。
            # よって scanner の exit を個別に受けてから gate へ渡す。
            scanner_status=0
            json="$(python3 "${SCANNER}" --json "${full}")" || scanner_status=$?
            if [ "${scanner_status}" -gt 1 ] || [ -z "${json}" ]; then
              echo "::error::L1 scanner 実行失敗 (exit=${scanner_status}) — fail-closed: ${rel}"
              tripped=1
            elif printf '%s' "${json}" | python3 "${GATE}" decide \
                --l1 - --profile ci --body "${full}" \
                --state "${VAULT_ROOT}/${TR_DIR}/_gate/gate_state.json"; then
              echo "✅ gate clean: ${rel}"
            else
              echo "::error::gate invariant violated (fetcher 側ゲートの回帰疑い): ${rel}"
              tripped=1
            fi
          done
          if [ "${tripped}" -eq 1 ]; then
            echo "❌ raw/ に non-clean レポートが残存。commit/push せず停止 (fetcher のゲート配線を点検)。"
            exit 1
          fi
          echo "✅ gate invariant re-check: 全 raw レポート clean"

      - name: Commit & push vault changes
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: vault
        env:
          # commit 前に明示確認: working-tree の対象パスのみ。-A は使わない
          # (CLAUDE.md の規約 — 誤って untracked secrets を巻き込まない)。
          # ここの TR_DIR は fetcher step の THREAT_REPORTS_FOLDER と同じ値を
          # 持たせる必要がある (デフォルトの 'Permanent Note/10_Threat_Reports'
          # ではなく vault repo 構造に合わせた '10_Threat_Reports')。
          TR_DIR: 10_Threat_Reports
          # 移行後の DB パス (.nosync)。前段の "Migrate threat DB" step が旧パスから運ぶので、
          # ここは常に新パスを指す。fetcher の PIPELINE_DB_DIR と一致させること (食い違うと
          # commit される .db が空 / stale になる)。
          DB_PATH: __skills/pipeline.nosync/threat_reports.db
        run: |
          set -euo pipefail
          git config user.name "llm-sec-weekly-bot"
          git config user.email "llm-sec-weekly-bot@users.noreply.github.com"

          # 個別パスを add (5 種: raw md 群 / JSON / index.md / _gate (判断トレース・
          # 隔離キュー・heightened 状態 — いずれも redact 済み) / DB)。すべて本パイプラインの
          # 既知の出力なので -f を付け、vault repo の .gitignore 方針に依存せず確実に追跡する。
          # 特に `.threat_reports.json` は dot 始まりで、Obsidian Vault 共通の
          # `.*` (全 dotfile 除外) gitignore に黙って弾かれる (commit から欠落し
          # _index.md の Dataview が壊れる) ため -f が必須。-A は使わず明示列挙のまま
          # (CLAUDE.md の secret 混入防止規約)。`_quarantine/` (untrusted 本文) は
          # 追跡しない (vault 側 .gitignore で除外のまま)。
          git add -f "${TR_DIR}/raw/" "${TR_DIR}/.threat_reports.json" "${TR_DIR}/_index.md" || true
          if [ -d "${TR_DIR}/_gate" ]; then
            git add -f "${TR_DIR}/_gate/"
          fi
          if [ -f "${DB_PATH}" ]; then
            # 二重防御: fetcher の closeDb() が既に wal_checkpoint(TRUNCATE) 済みのはずだが、
            # commit される .db を確実に自己完結 (WAL 取り残しゼロ) にするため明示 checkpoint。
            # tracked な -wal/-shm が古いまま checkout されるとデータが巻き戻るため、本体 .db に
            # WAL を畳んでから add する。-wal/-shm は vault repo 側で gitignore 済 (履歴の
            # tracked 分は git rm --cached で除去)。
            #
            # wal_checkpoint は別接続が WAL を保持していると throw せず `busy|log|checkpointed`
            # の busy=1 を返し WAL を畳めないまま「成功」扱いになる。その .db を commit すると
            # 最新書込を欠く (このPRが防ぐ巻き戻りそのもの) ため、busy!=0 / コマンド失敗時は
            # commit せず fail する (loud-fail / self-healing: 次の cron で再 ingest される)。
            ckpt="$(sqlite3 "${DB_PATH}" "PRAGMA wal_checkpoint(TRUNCATE);")" || ckpt=""
            busy="${ckpt%%|*}"
            if [ "${busy}" != "0" ]; then
              echo "::error::wal_checkpoint が WAL を畳み込めませんでした (result='${ckpt}')。本体 .db を commit せず停止。"
              exit 1
            fi
            git add -f "${DB_PATH}"
          fi

          if git diff --staged --quiet; then
            echo "✅ vault に変更なし (新規 ingest 0 件 or 既に同期済)"
            exit 0
          fi

          git commit -m "chore: weekly LLM threat report ingest ($(date -u +%Y-%m-%d))"

          # push リトライ ×4 (attempt 間の指数 backoff 2s/4s/8s)。既知の失敗要因は
          # 人間の手動 push が先行して non-fast-forward になるケースで、これは決定的
          # 失敗なので素の retry では 4 回全滅する。失敗のたびに fetch→rebase で
          # remote を取り込んでから再試行する (terminal-ops-logs の archive-session.sh
          # と同戦略に統一)。fetch-depth:1 のままでも、人間 push は checkout 時 tip の
          # 子孫なので増分 fetch で merge-base に届き rebase は成立する。
          # ブランチ名はハードコードしない (vault 側 default branch に追従)。
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          if [ "${BRANCH}" = "HEAD" ]; then
            echo "::error::detached HEAD のため push 先ブランチを特定できません (vault checkout 設定を確認)"
            exit 1
          fi
          for attempt in 1 2 3 4; do
            if git push origin "${BRANCH}"; then
              echo "✅ push 成功 (attempt ${attempt})"
              exit 0
            fi
            # non-ff か一時 network エラーかは exit code で区別できないため、まず
            # remote を取り込む。rebase 先は FETCH_HEAD (actions/checkout が残す
            # narrow refspec に依存しない)。fetch 自体の失敗は network 起因とみなし
            # backoff のみで再試行する。
            if git fetch origin "${BRANCH}"; then
              if ! git rebase FETCH_HEAD; then
                # rebase 衝突 = 人手 curate と自動 ingest が同一ファイルを両側編集した
                # 稀ケース。`-X theirs` での自動解決は禁止 (.db はバイナリで、人手の
                # ai_relevance_note を silent clobber し得る)。abort して loud-fail し、
                # 次の cron / workflow_dispatch に委ねる (processed ラベル未付与のまま
                # 残るので再取込され、ingest は UPSERT 冪等 = 自己修復)。
                git rebase --abort || true
                echo "::error::vault push の rebase が衝突しました。自動解決せず停止します (次回 run が UPSERT 冪等で再取込・自己修復)。"
                exit 1
              fi
            else
              echo "⚠️ fetch 失敗 (attempt ${attempt}) — network 起因とみなし backoff のみで再試行"
            fi
            if [ "${attempt}" -lt 4 ]; then
              sleep $((2 ** attempt))
            fi
          done
          echo "::error::push 4 回失敗 (rebase 済みでも push 不可 — deploy key / vault 側 branch protection を確認)"
          exit 1

      # ----------------------------------------------------------------
      # Phase 2: pending-labels.json を読んで Gmail に processed ラベル付与
      #
      # `if: success()` により、前段の "Run fetcher (phase 1)" と
      # "Commit & push vault changes" がいずれも成功した場合のみ動く。
      # vault push が失敗したら label は付かない → 該当 thread は
      # 次回 cron で再 ingest される (= 永久 skip 回避 = self-healing)。
      # dry_run の場合は phase 1 が空ファイルを書くので phase 2 も no-op。
      # ----------------------------------------------------------------
      - name: Run fetcher (phase 2 — apply Gmail labels after push)
        if: ${{ success() && github.event.inputs.dry_run != 'true' }}
        working-directory: pipeline
        env:
          # phase 2 は DB を触らないが、validateEnv の責務を変えると影響範囲が
          # 広がるので、phase 1 と同じ env を維持する (VAULT_ROOT / PIPELINE_DB_DIR 含む)。
          VAULT_ROOT: ${{ github.workspace }}/vault
          PIPELINE_DB_DIR: ${{ github.workspace }}/vault/__skills/pipeline.nosync
          THREAT_REPORTS_FOLDER: 10_Threat_Reports
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          LLM_SEC_LABEL_NAME: ${{ secrets.LLM_SEC_LABEL_NAME }}
          LLM_SEC_PROCESSED_LABEL_NAME: ${{ secrets.LLM_SEC_PROCESSED_LABEL_NAME }}
          LLM_SEC_MAX_RESULTS: ${{ secrets.LLM_SEC_MAX_RESULTS }}
          PENDING_LABELS_FILE: ${{ github.workspace }}/pending-labels.json
        run: pnpm tsx scripts/llm_sec_weekly_fetcher.ts --phase=label
