name: LLM-Sec-Weekly Auto Ingest

# 週次 LLM 脅威レポートを Gmail から自動取込し、Vault リポへ commit する
# Level 1 自動化。Security-only mode で人間が手で行うフローを丸ごと cron 化。
#
# 取込される MD / DB / JSON は本リポ (obsidian-ai-pipeline) ではなく
# 別 private repo (= "vault repo") に push される。
# vault repo の URL は VAULT_REPO secret で渡す (`owner/name` 形式)。
#
# 設計上の前提:
#   - vault repo は threat_reports.db を gitignore しない (ai_relevance_note を
#     run 間で保持するため)。詳細は docs/security/llm-sec-weekly-automation.md
#   - メール本文は untrusted_input。本 workflow は parse 時に
#     `forbidden_usage: execute_report_instructions` 契約を強制する
#     (parser が ContractError を throw)。

on:
  schedule:
    # 月曜 00:00 UTC = 月曜 09:00 JST (送信予定の 8:00 JST + 1 時間バッファ)
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '取込試行のみ (Gmail label 付与 / vault push を skip)'
        type: boolean
        default: false

# GITHUB_TOKEN は read-only。vault repo への push は別資格情報 (deploy key)。
# Megalodon 級供給網攻撃でこのジョブが乗っ取られても、本リポは書き換えられない。
permissions:
  contents: read

# 同時実行禁止 (Gmail API rate / vault repo race を避ける)。
# 前回 run が走行中の間は新規 trigger を待たせる。
concurrency:
  group: llm-sec-weekly-ingest
  cancel-in-progress: false

jobs:
  ingest:
    name: Fetch & ingest weekly threat report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pipeline repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          path: pipeline

      - name: Checkout vault repo (private)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          repository: ${{ secrets.VAULT_REPO }}
          ssh-key: ${{ secrets.VAULT_DEPLOY_KEY }}
          path: vault
          # default branch を chekout (vault 側で main 以外を使うなら secret 化)
          fetch-depth: 1

      - name: Setup pnpm
        # Third-party action — SHA pin (CI workflow と同 SHA で揃える)。
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v5.0.0
        with:
          # path: pipeline で checkout しているので workspace root に package.json が
          # 無く、デフォルトの `./package.json` 自動検出が失敗する。pipeline 側を明示。
          package_json_file: pipeline/package.json

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pipeline/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: pipeline
        run: pnpm install --frozen-lockfile

      - name: Rebuild native dependencies (better-sqlite3)
        working-directory: pipeline
        run: pnpm rebuild better-sqlite3

      # ----------------------------------------------------------------
      # Phase 1: ingest only (label は付けない)
      #
      # 成功した thread の id は pending-labels.json に書き出され、
      # 後段の "Apply Gmail labels" step で label される。
      # 順序: ingest → vault push → label。途中の step が失敗すると
      # label step は実行されず、対象 thread はラベル無しで残るため
      # 次の cron で再試行 (= self-healing)。
      # ----------------------------------------------------------------
      - name: Run fetcher (phase 1 — ingest only)
        working-directory: pipeline
        env:
          VAULT_ROOT: ${{ github.workspace }}/vault
          # vault repo (= theosera/obsidian-permanent-note) は "Permanent Note"
          # フォルダの中身そのものが repo ルートにある構造なので、デフォルトの
          # 'Permanent Note/10_Threat_Reports' ではなく '10_Threat_Reports' を
          # 直接ベースに指定する。別構造の vault に切り替える場合はこの値だけ
          # 変えれば良い (絶対パス / `..` traversal は parser 側で拒否)。
          THREAT_REPORTS_FOLDER: 10_Threat_Reports
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          # 既定で十分だが上書き可能 (任意 secrets)
          LLM_SEC_LABEL_NAME: ${{ secrets.LLM_SEC_LABEL_NAME }}
          LLM_SEC_PROCESSED_LABEL_NAME: ${{ secrets.LLM_SEC_PROCESSED_LABEL_NAME }}
          LLM_SEC_MAX_RESULTS: ${{ secrets.LLM_SEC_MAX_RESULTS }}
          # ingest と label で同じファイルを参照する必要があるので絶対パスで固定
          # (vault checkout の中ではないので git commit には巻き込まれない)。
          PENDING_LABELS_FILE: ${{ github.workspace }}/pending-labels.json
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            pnpm tsx scripts/llm_sec_weekly_fetcher.ts --phase=ingest --dry-run
          else
            pnpm tsx scripts/llm_sec_weekly_fetcher.ts --phase=ingest
          fi

      - name: Commit & push vault changes
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: vault
        env:
          # commit 前に明示確認: working-tree の対象パスのみ。-A は使わない
          # (CLAUDE.md の規約 — 誤って untracked secrets を巻き込まない)。
          # ここの TR_DIR は fetcher step の THREAT_REPORTS_FOLDER と同じ値を
          # 持たせる必要がある (デフォルトの 'Permanent Note/10_Threat_Reports'
          # ではなく vault repo 構造に合わせた '10_Threat_Reports')。
          TR_DIR: 10_Threat_Reports
          DB_PATH: __skills/pipeline/threat_reports.db
        run: |
          set -euo pipefail
          git config user.name "llm-sec-weekly-bot"
          git config user.email "llm-sec-weekly-bot@users.noreply.github.com"

          # 個別パスを add (3 種: raw md 群 / JSON / index.md)。
          # DB は vault repo の .gitignore で除外されていれば -f が必要だが、
          # runbook で「vault repo は threat_reports.db を gitignore しない」を
          # 約束しているのでここでは普通の git add を使う。
          # それでも追跡されていなかった場合に備えて 1 回 -f でリトライする。
          git add "${TR_DIR}/raw/" "${TR_DIR}/.threat_reports.json" "${TR_DIR}/_index.md" || true
          if [ -f "${DB_PATH}" ]; then
            git add "${DB_PATH}" || git add -f "${DB_PATH}"
          fi

          if git diff --staged --quiet; then
            echo "✅ vault に変更なし (新規 ingest 0 件 or 既に同期済)"
            exit 0
          fi

          git commit -m "chore: weekly LLM threat report ingest ($(date -u +%Y-%m-%d))"

          # network エラーリトライ (CLAUDE.md 規約: 2s/4s/8s/16s)
          for attempt in 1 2 3 4; do
            if git push; then
              echo "✅ push 成功 (attempt ${attempt})"
              exit 0
            fi
            sleep $((2 ** attempt))
          done
          echo "❌ push 4 回失敗"
          exit 1

      # ----------------------------------------------------------------
      # Phase 2: pending-labels.json を読んで Gmail に processed ラベル付与
      #
      # `if: success()` により、前段の "Run fetcher (phase 1)" と
      # "Commit & push vault changes" がいずれも成功した場合のみ動く。
      # vault push が失敗したら label は付かない → 該当 thread は
      # 次回 cron で再 ingest される (= 永久 skip 回避 = self-healing)。
      # dry_run の場合は phase 1 が空ファイルを書くので phase 2 も no-op。
      # ----------------------------------------------------------------
      - name: Run fetcher (phase 2 — apply Gmail labels after push)
        if: ${{ success() && github.event.inputs.dry_run != 'true' }}
        working-directory: pipeline
        env:
          # phase 2 は DB を触らないが、validateEnv の責務を変えると影響範囲が
          # 広がるので、phase 1 と同じ env を維持する (VAULT_ROOT 含む)。
          VAULT_ROOT: ${{ github.workspace }}/vault
          THREAT_REPORTS_FOLDER: 10_Threat_Reports
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          LLM_SEC_LABEL_NAME: ${{ secrets.LLM_SEC_LABEL_NAME }}
          LLM_SEC_PROCESSED_LABEL_NAME: ${{ secrets.LLM_SEC_PROCESSED_LABEL_NAME }}
          LLM_SEC_MAX_RESULTS: ${{ secrets.LLM_SEC_MAX_RESULTS }}
          PENDING_LABELS_FILE: ${{ github.workspace }}/pending-labels.json
        run: pnpm tsx scripts/llm_sec_weekly_fetcher.ts --phase=label
