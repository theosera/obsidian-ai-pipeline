name: CI

on:
  pull_request:
  push:
    branches: [main]

# GITHUB_TOKEN は read-only に制限（least privilege）
permissions:
  contents: read

# 同一PR/ブランチで連続push時に古いジョブをキャンセルする。
# ただし main では常に最後まで走らせる（merge commit ごとの緑/赤履歴を確実に残すため）。
# 例: 短時間に連続 merge すると 1 本目の run が 2 本目に cancel され、1 本目の
# 変更が main 上で検証されないまま残ってしまう事故を防ぐ。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pipeline:
    name: Pipeline (root) - test & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup pnpm
        # Third-party action — Megalodon 級の supply-chain 防御として SHA pin。
        # `@v5` タグが書き換わっても追従しない。バージョン更新は明示的に SHA を
        # 差し替える運用 (Dependabot が PR で提案する)。
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
        # packageManager フィールド (pnpm@10.33.0) から自動検出

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Lint package.json files for duplicate keys
        # node/python accept duplicate JSON keys silently (last-wins). Catch
        # malformed manifests before they slip into main (see PR #23 post-mortem).
        run: python3 .github/scripts/check-package-json-duplicates.py

      - name: Run injection-gate tests (python, deterministic)
        # L1 (scan-threat-report.py) + L3 (gate_decision.py) の決定論回帰。
        # stdlib のみで pnpm install 不要のため依存インストールより先に走らせる。
        run: |
          python3 .claude/skills/scan-threat-report/tests/run_l1_tests.py
          python3 .claude/skills/scan-threat-report/tests/run_gate_tests.py

      - name: Run vault-ops acceptance tests (bash, sandboxed git)
        # vault-ops skill (pre-push hook / safe push wrapper / installer) の
        # 決定論回帰。tmp 配下に bare origin + clone を作るだけで network /
        # pnpm 不要のため、injection-gate テスト同様、依存インストールより
        # 先に走らせる。
        run: bash .claude/skills/vault-ops/tests/run_vault_ops_tests.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild native dependencies (better-sqlite3)
        # pnpm 10 はデフォルトでビルドスクリプトを無効化する。pnpm-workspace.yaml の
        # onlyBuiltDependencies で allowlist 済みだが、CI の pnpm store
        # キャッシュが設定追加前の状態を再利用するケースがあるため、確実に
        # native .node バイナリを生成するよう明示リビルドする。
        #
        # バージョン方針 (better-sqlite3 = v12.11.1 / 正典): ここで毎回ソースビルド
        # するため upstream のプリビルトバイナリ Node 対応マトリクスに依存せず、新しい
        # Node ABI 向けに .node をコンパイルできる。
        #
        # v11.10.0 からの bump (PR #136) は【mitigation であって fix ではない】。
        # ⛔ 「v11 のバグが v12 で解消された」ではない — 欠陥は v12.11.1 にも完全に残る。
        #
        # 真因は better-sqlite3 ではなく Node の node::ObjectWrap (影響範囲は下記):
        #   ~ObjectWrap が RemoveEnvironmentCleanupHook を無条件に呼ぶが、これは
        #   V8 の first-pass weak callback (= context 未進入) から走りうるため
        #   Environment::GetCurrent(isolate) が nullptr を返して CHECK が落ちる ->
        #     node::RemoveEnvironmentCleanupHook / Assertion failed: (env) != nullptr
        #   gdb 実測のフレーム: ~Database -> ~ObjectWrap -> RemoveCleanupHook ->
        #     RemoveEnvironmentCleanupHook  (呼び元は基底クラスであって better-sqlite3 ではない)
        #   ⛔ 「env 破棄後」ではない。env は生きていて、context が entered でないだけ。
        #
        # 【下記の影響ヘッダでビルドされている】かつ【context 未進入の GC が走る】という条件の下で、
        # 発火を決めるのは「wrapper が実行中に GC で回収されること」。2x2 介入実験で
        # close 済み / 未 close ともに 20/20 abort、強参照で pin すると 0/40 (2026-09-08 実測)。
        # ⇒ ⛔ close 漏れは原因ではない。close を徹底しても効果はゼロ。
        # ⚠️ ただしこの実験が示したのは【close 状態が因果でないこと】と【GC 回収で発火しうること】
        #    までで、⛔ GC 回収【だけ】でヘッダ版・実行文脈をまたいで十分、までは示していない
        #    (★ 実験は単一の Node 版・単一のアーキテクチャで実施)。
        # ⇒ v12 で実スイートが緑になるのは GC/アロケーション特性が変わって条件が
        #    同時成立しなくなったためで、テスト追加・依存更新・Node 更新で再発しうる。
        #
        # 落ちるのは全テストが通った後ではなく【走行中】なので、テスト失敗 0 件のまま
        # exit 134 になる (落ちた run はいずれも「全テスト合格」を出していない)。
        #
        # ⚠️ ローカルで再現しないのは OS 差ではなく【Node のバージョン差】。当該 cleanup hook
        # が無いヘッダでビルドした .node には abort に至るコードパスが物理的に存在しない
        # (nm で実測)。ヘッダ二分探索の結果 (2026-09-08 実測):
        #   24.x: <= 24.18.0 無し / 24.19.0・24.20.0 有り
        #   25.x / 26.x: 無し          nodejs/node main: 有り
        # ⇒ ⛔ 影響を受けるのは【24.19.0 以上の 24.x 系】であって「24.19.0 以上すべて」ではない。
        # ⇒ ⛔ 25.x / 26.x での緑も検証にならない (24.19+/24.x での緑でなければ意味がない)。
        #    package.json の engines は node >= 24.0.0 を許すので、ローカルの版に注意する。
        # ⚠️ upstream の main にはこの hook が再び在るため、将来の版で再発しうる。
        #    ⇒ 「25 系へ上げれば構造的に安全」とは言えない (未リリース版は未検証)。
        #
        # 検証は CI の反復でなくローカルのコンテナで行える:
        #   docker run --rm -v "$PWD:/w" -w /w node:24.20.0 \
        #     bash -lc 'corepack enable && pnpm install --frozen-lockfile && pnpm test'
        #   (node_modules は Linux ビルドになるので、ホストと同じ木で走らせないこと)
        # ⚠️ 既定条件の発生率は run バッチ間で大きくばらつく (5/25・2/5・0/10 等)。
        #    少数回の緑は証拠にならない。回帰を見るなら決定的な arm を使う:
        #      NODE_OPTIONS=--max-semi-space-size=1 pnpm test
        #    (v11.10.0 = 12/12 crash / v12.11.1 = 0/12。2026-09-08 実測)
        #
        # 次に v13 以降へ上げる条件は据え置き時と同じ 5 つ (番号もそのまま)。
        # ⚠️ v12 への bump は、この 5 条件のどれが発動したものでもない (上記のとおり
        #    mitigation)。条件 4 が発動したという当初の説明は誤りだった:
        #   1. この rebuild (ソースビルド) を外しプリビルトバイナリ依存へ切替える
        #   2. ビルドツールチェーン無しのローカル環境を公式サポート対象に含める
        #   3. 将来の Node メジャーで v12 系がソースビルドすら失敗する
        #   4. v12 系に未修正 CVE / バグがあり v13 で解消される
        #   5. 他の依存が better-sqlite3 v13 を要求する
        # 経緯: PR #121 (Node 24 化) の Codex P1 レビュー / PR #136 (v12 bump)。
        run: pnpm rebuild better-sqlite3

      - name: Run security tests (24 cases)
        run: pnpm test

      - name: TypeScript type check
        run: pnpm typecheck

      - name: oxlint (root app code, type-aware)
        # 最小 oxlint: バグ検出ルールのみ (no-floating-promises 等)。
        # 型情報ルールは oxlint-tsgolint (--type-aware) が担当。
        run: pnpm lint
