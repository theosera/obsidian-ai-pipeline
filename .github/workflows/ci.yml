name: CI

on:
  pull_request:
  push:
    branches: [main]

# GITHUB_TOKEN は read-only に制限（least privilege）
permissions:
  contents: read

# 同一PR/ブランチで連続push時に古いジョブをキャンセルする。
# ただし main では常に最後まで走らせる（merge commit ごとの緑/赤履歴を確実に残すため）。
# 例: 短時間に連続 merge すると 1 本目の run が 2 本目に cancel され、1 本目の
# 変更が main 上で検証されないまま残ってしまう事故を防ぐ。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pipeline:
    name: Pipeline (root) - test & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup pnpm
        # Third-party action — Megalodon 級の supply-chain 防御として SHA pin。
        # `@v5` タグが書き換わっても追従しない。バージョン更新は明示的に SHA を
        # 差し替える運用 (Dependabot が PR で提案する)。
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        # packageManager フィールド (pnpm@10.33.0) から自動検出

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Lint package.json files for duplicate keys
        # node/python accept duplicate JSON keys silently (last-wins). Catch
        # malformed manifests before they slip into main (see PR #23 post-mortem).
        run: python3 .github/scripts/check-package-json-duplicates.py

      - name: Provision pinned Git consumer for guard fixtures
        timeout-minutes: 20
        # The unchanged full bank includes allow-side consumer proofs pinned to
        # Git 2.54.0. Runner-image Git versions are not interchangeable evidence.
        # Install only in this ephemeral runner; no native transport is tested.
        run: |
          git_build="$(mktemp -d "$RUNNER_TEMP/git-guard-build.XXXXXX")"
          trap 'rm -rf "$git_build"' EXIT
          archive="$git_build/git-2.54.0.tar.xz"
          curl --disable --fail --silent --show-error --location --proto '=https' \
            https://www.kernel.org/pub/software/scm/git/git-2.54.0.tar.xz \
            --output "$archive"
          printf '%s  %s\n' \
            f689162364c10de79ef89aa8dbf48731eb057e34edbbd20aca510ce0154681a3 \
            "$archive" | sha256sum --check --strict
          tar -xJf "$archive" -C "$git_build"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential libcurl4-openssl-dev libexpat1-dev libssl-dev \
            zlib1g-dev perl python3
          # The same prefix/features apply to compilation and installation.
          # Preserve CLI helper/transport consumers; omit only GUI and localization.
          git_make_args=(prefix=/usr NO_TCLTK=YesPlease NO_GETTEXT=YesPlease)
          make -C "$git_build/git-2.54.0" -j2 "${git_make_args[@]}" all
          sudo make -C "$git_build/git-2.54.0" "${git_make_args[@]}" install
          /usr/bin/git --no-lazy-fetch --version

      - name: Run complete Git guard suite (components, filename parity, full L2 bank)
        timeout-minutes: 60
        # Command strings in the L2 bank are Hook JSON DATA. Native Git creates
        # disposable DUMMY fixtures; this does not exercise native transport or L3.
        run: |
          guard_home="$(mktemp -d "$RUNNER_TEMP/git-guard-home.XXXXXX")"
          trap 'rm -rf "$guard_home"' EXIT
          node_bin="$(dirname "$(command -v node)")"
          # Keep caller configuration and credentials out of the owned fixtures.
          # XDG_CONFIG_HOME and other selector overrides are absent, rather than
          # changing the case-defined selection with an outer default.
          env -i PATH="$node_bin:/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/bin:/opt/homebrew/bin" HOME="$guard_home" TMPDIR="$RUNNER_TEMP" \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
            GIT_CONFIG_SYSTEM=/dev/null LC_ALL=C \
            bash --noprofile --norc -euo pipefail <<'GUARD_TESTS'
          node <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const guard = require('./.claude/hooks/lib/git-guard-common.cjs');
          const readers = require('./.claude/hooks/lib/git-precommit-readers.cjs');
          const git = guard.resolveTrustedGitExecutable({ text: 'git' }, process.env, process.cwd());
          if (!git) throw new Error('CI needs Git in an independently trusted installation');
          if (git !== fs.realpathSync('/usr/bin/git') || git !== fs.realpathSync('/bin/git')) {
            throw new Error('Bare Git and the absolute fixture paths must select the same pinned installation');
          }
          const version = spawnSync(git, ['--no-lazy-fetch', '--version'], {
            cwd: process.cwd(), env: process.env, encoding: 'utf8',
          });
          if (version.error || version.status !== 0 || version.stdout.trim() !== 'git version 2.54.0' ||
              !readers.supportsInspectionHardening(version.stdout)) {
            throw new Error('CI needs Git 2.54.0, actual --no-lazy-fetch support, and the separate fsmonitor floor: ' +
              (version.error?.message || version.stderr || version.stdout));
          }
          console.log(JSON.stringify({ node: process.version, git, version: version.stdout.trim() }));
          NODE
          # Discover every component test; the standalone full-bank runner and
          # filename parity retain their documented, separate invocation modes.
          component_tests=()
          for test_file in .claude/hooks/tests/*.test.cjs; do
            case "$test_file" in
              */git-guards.test.cjs|*/secret-path-parity.test.cjs) ;;
              *) component_tests+=("$test_file") ;;
            esac
          done
          test "${#component_tests[@]}" -gt 0
          node --test "${component_tests[@]}"
          node --test .claude/hooks/tests/secret-path-parity.test.cjs
          # Preserve original assertion totals beside the explicit R54 selected-
          # executable profile. Missing/unsupported selection is UNKNOWN, not
          # evidence that the unavailable program's argv semantics were exercised.
          # R57 separately records eleven new sudo policy-root restrictions;
          # preserve original and pre-policy results, distinct from backend absence.
          node .claude/hooks/tests/git-guards.test.cjs --executable-profile --r57-policy-contract
          GUARD_TESTS

      - name: Run injection-gate tests (python, deterministic)
        # L1 (scan-threat-report.py) + L3 (gate_decision.py) の決定論回帰。
        # stdlib のみで pnpm install 不要のため依存インストールより先に走らせる。
        run: |
          python3 .claude/skills/scan-threat-report/tests/run_l1_tests.py
          python3 .claude/skills/scan-threat-report/tests/run_gate_tests.py

      - name: Run vault-ops acceptance tests (bash, sandboxed git)
        # vault-ops skill (pre-push hook / safe push wrapper / installer) の
        # 決定論回帰。tmp 配下に bare origin + clone を作るだけで network /
        # pnpm 不要のため、injection-gate テスト同様、依存インストールより
        # 先に走らせる。
        run: bash .claude/skills/vault-ops/tests/run_vault_ops_tests.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild native dependencies (better-sqlite3)
        # pnpm 10 はデフォルトでビルドスクリプトを無効化する。pnpm-workspace.yaml の
        # onlyBuiltDependencies で allowlist 済みだが、CI の pnpm store
        # キャッシュが設定追加前の状態を再利用するケースがあるため、確実に
        # native .node バイナリを生成するよう明示リビルドする。
        #
        # バージョン方針 (better-sqlite3 = v12.11.1 / 正典): ここで毎回ソースビルド
        # するため upstream のプリビルトバイナリ Node 対応マトリクスに依存せず、新しい
        # Node ABI 向けに .node をコンパイルできる。
        #
        # v11.10.0 からの bump (PR #136) は【mitigation であって fix ではない】。
        # ⛔ 「v11 のバグが v12 で解消された」ではない — 欠陥は v12.11.1 にも完全に残る。
        #
        # 真因は better-sqlite3 ではなく Node の node::ObjectWrap (影響範囲は下記):
        #   ~ObjectWrap が RemoveEnvironmentCleanupHook を無条件に呼ぶが、これは
        #   V8 の first-pass weak callback (= context 未進入) から走りうるため
        #   Environment::GetCurrent(isolate) が nullptr を返して CHECK が落ちる ->
        #     node::RemoveEnvironmentCleanupHook / Assertion failed: (env) != nullptr
        #   gdb 実測のフレーム: ~Database -> ~ObjectWrap -> RemoveCleanupHook ->
        #     RemoveEnvironmentCleanupHook  (呼び元は基底クラスであって better-sqlite3 ではない)
        #   ⛔ 「env 破棄後」ではない。env は生きていて、context が entered でないだけ。
        #
        # 【下記の影響ヘッダでビルドされている】かつ【context 未進入の GC が走る】という条件の下で、
        # 発火を決めるのは「wrapper が実行中に GC で回収されること」。2x2 介入実験で
        # close 済み / 未 close ともに 20/20 abort、強参照で pin すると 0/40 (2026-09-08 実測)。
        # ⇒ ⛔ close 漏れは原因ではない。close を徹底しても効果はゼロ。
        # ⚠️ ただしこの実験が示したのは【close 状態が因果でないこと】と【GC 回収で発火しうること】
        #    までで、⛔ GC 回収【だけ】でヘッダ版・実行文脈をまたいで十分、までは示していない
        #    (★ 実験は単一の Node 版・単一のアーキテクチャで実施)。
        # ⇒ v12 で実スイートが緑になるのは GC/アロケーション特性が変わって条件が
        #    同時成立しなくなったためで、テスト追加・依存更新・Node 更新で再発しうる。
        #
        # 落ちるのは全テストが通った後ではなく【走行中】なので、テスト失敗 0 件のまま
        # exit 134 になる (落ちた run はいずれも「全テスト合格」を出していない)。
        #
        # ⚠️ ローカルで再現しないのは OS 差ではなく【Node のバージョン差】。当該 cleanup hook
        # が無いヘッダでビルドした .node には abort に至るコードパスが物理的に存在しない
        # (nm で実測)。ヘッダ二分探索の結果 (2026-09-08 実測):
        #   24.x: <= 24.18.0 無し / 24.19.0・24.20.0 有り
        #   25.x / 26.x: 無し          nodejs/node main: 有り
        # ⇒ ⛔ 影響を受けるのは【24.19.0 以上の 24.x 系】であって「24.19.0 以上すべて」ではない。
        # ⇒ ⛔ 25.x / 26.x での緑も検証にならない (24.19+/24.x での緑でなければ意味がない)。
        #    package.json の engines は node ^24.15.0 || >=26.0.0 (24.19 以上の 24.x を含む) を許すので、ローカルの版に注意する。
        # ⚠️ upstream の main にはこの hook が再び在るため、将来の版で再発しうる。
        #    ⇒ 「25 系へ上げれば構造的に安全」とは言えない (未リリース版は未検証)。
        #
        # 検証は CI の反復でなくローカルのコンテナで行える:
        #   docker run --rm -v "$PWD:/w" -w /w node:24.20.0 \
        #     bash -lc 'corepack enable && pnpm install --frozen-lockfile && pnpm test'
        #   (node_modules は Linux ビルドになるので、ホストと同じ木で走らせないこと)
        # ⚠️ 既定条件の発生率は run バッチ間で大きくばらつく (5/25・2/5・0/10 等)。
        #    少数回の緑は証拠にならない。回帰を見るなら決定的な arm を使う:
        #      NODE_OPTIONS=--max-semi-space-size=1 pnpm test
        #    (v11.10.0 = 12/12 crash / v12.11.1 = 0/12。2026-09-08 実測)
        #
        # 次に v13 以降へ上げる条件は据え置き時と同じ 5 つ (番号もそのまま)。
        # ⚠️ v12 への bump は、この 5 条件のどれが発動したものでもない (上記のとおり
        #    mitigation)。条件 4 が発動したという当初の説明は誤りだった:
        #   1. この rebuild (ソースビルド) を外しプリビルトバイナリ依存へ切替える
        #   2. ビルドツールチェーン無しのローカル環境を公式サポート対象に含める
        #   3. 将来の Node メジャーで v12 系がソースビルドすら失敗する
        #   4. v12 系に未修正 CVE / バグがあり v13 で解消される
        #   5. 他の依存が better-sqlite3 v13 を要求する
        # 経緯: PR #121 (Node 24 化) の Codex P1 レビュー / PR #136 (v12 bump)。
        run: pnpm rebuild better-sqlite3

      - name: Run security tests (24 cases)
        run: pnpm test

      - name: TypeScript type check
        run: pnpm typecheck

      - name: oxlint (root app code, type-aware)
        # 最小 oxlint: バグ検出ルールのみ (no-floating-promises 等)。
        # 型情報ルールは oxlint-tsgolint (--type-aware) が担当。
        run: pnpm lint

      - name: oxlint positive control (type-aware rules must fire)
        # --type-aware (package.json) と options.typeAware (.oxlintrc.json) の両方が
        # 外れると、type-aware ルールは黙って走らなくなり lint は緑のままになる。
        # 既知の悪いファイルで 2 ルールが発火することを確かめる。悪いファイルを
        # リポに置くとふだんの `pnpm lint` が赤になるので、この step の中で作って消す。
        run: |
          set -u
          mkdir -p .lint-canary
          cat > .lint-canary/canary.ts <<'TS'
          async function work(): Promise<boolean> { return true; }
          export function floating(): void {
            work();
          }
          export function misused(): void {
            if (work()) { return; }
          }
          TS
          # Actions の shell は bash -e。赤を期待する呼び出しは if で包む。
          if out=$(pnpm -s lint .lint-canary/canary.ts 2>&1); then rc=0; else rc=$?; fi
          rm -rf .lint-canary
          printf '%s\n' "$out"
          [ "$rc" -ne 0 ] || { echo "::error::oxlint passed a known-bad file (rc=0)"; exit 1; }
          for rule in no-floating-promises no-misused-promises; do
            grep -q "typescript($rule)" <<<"$out" || { echo "::error::type-aware rule $rule did not fire"; exit 1; }
          done
          echo "positive control OK"
