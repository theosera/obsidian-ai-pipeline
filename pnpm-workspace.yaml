# Native modules allowed to run install/build scripts. pnpm v10+ blocks
# dependency build scripts by default; this allow-list lets better-sqlite3
# compile its native binding. Moved here from package.json's "pnpm" field,
# which pnpm v11 no longer reads (see https://pnpm.io/settings).
onlyBuiltDependencies:
  - better-sqlite3

# Shared dev-tool versions, referenced via `"typescript": "catalog:"` etc. in
# the root package.json. Bump here once. (chrome-extension is intentionally an
# isolated workspace and does not use this catalog.)
catalog:
  typescript: ^5.7.0
  '@types/node': ^25.5.2
  tsx: ^4.21.0
